<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Basic Setup and Print Styles */
        :root {
            --bg-color: #FEFBF1;
            --border-color: #E5A88E;
            --header-color: #4A6B65;
            --sun-color: #F7C68F;
            --cloud-color: #F5F5F5;
            --rainbow-blue: #A9D4D9;
            --rainbow-green: #A3D1B0;
            --rainbow-peach: #F3D2C1;
            --accent-green: #6A6B65;
            --apple-green: #A3CC8B;
        }

        body {
            font-family: 'Kalam', cursive;
            background-color: var(--bg-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--header-color);
            overflow: hidden; /* Hide overflow from decorative elements */
            transition: background-color 0.5s;
        }

        @media print {
            body {
                padding: 0;
                margin: 0;
                overflow: hidden;
                -webkit-print-color-adjust: exact; /* For Chrome, Safari */
                color-adjust: exact; /* Standard */
            }
            .page-container {
                margin: 0;
                border: none;
                transform-origin: top left;
                width: 297mm;
                height: 210mm;
            }
            .decoration {
                 display: block; /* Ensure decorations are printed */
            }
            .theme-switcher {
                display: none !important;
            }
            [contenteditable]:hover {
                background-color: transparent !important;
                outline: none !important;
            }
        }

        @page {
            size: A4 landscape;
            margin: 0;
        }

        /* Main container for content and decorations */
        .page-container {
            position: relative;
            width: 277mm;
            height: 190mm;
            padding: 15px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.5s;
        }
        
        .content-wrapper {
            position: relative;
            width: 85%;
            height: 85%;
            z-index: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: background-color 0.5s;
        }

        /* Header section */
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--header-color);
            margin: 0;
            text-shadow: 2px 2px 0px #ffffff;
        }
        .user-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 10px;
            font-size: 16px;
            align-items: baseline;
        }
        .user-info-item {
            display: flex;
            gap: 10px;
            align-items: baseline;
        }
        .editable-underline {
            border-bottom: 2px solid var(--border-color);
            min-width: 150px;
            padding: 0 5px;
        }

        /* Timetable styles */
        .timetable {
            width: 100%;
            border-collapse: collapse;
            flex-grow: 1;
        }
        .timetable th, .timetable td {
            border: 2px solid var(--border-color);
            text-align: center;
            font-size: 14px;
            padding: 5px;
            transition: border-color 0.5s;
        }
        .timetable th {
            font-weight: bold;
            color: var(--header-color);
        }
        .timetable td:first-child {
            font-weight: bold;
            color: var(--header-color);
        }
        
        /* Editable Content Style */
        [contenteditable="true"] {
            outline: 2px solid transparent;
            transition: background-color 0.3s, outline 0.3s;
            border-radius: 4px;
        }
        [contenteditable="true"]:hover {
            background-color: rgba(229, 168, 142, 0.1);
        }
        [contenteditable="true"]:focus {
            background-color: white;
            outline: 2px solid var(--border-color);
            box-shadow: 0 0 5px rgba(229, 168, 142, 0.5);
        }

        /* Theme Switcher */
        .theme-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        .theme-switcher select {
            font-family: 'Kalam', cursive;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid var(--header-color);
            background-color: var(--bg-color);
            color: var(--header-color);
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        /* Decorations */
        .decoration {
            position: absolute;
            z-index: 0;
        }
        
        .dec-sun { top: 10px; left: 48%; width: 90px; }
        .dec-rainbow1 { top: 15px; left: 20px; width: 160px; transform: rotate(-10deg); }
        .dec-palette { top: 25px; right: 40px; width: 110px; }

        .dec-book { bottom: 120px; right: 5px; width: 100px; }

        .dec-cloud { bottom: 5px; left: 55%; width: 140px;}
        .dec-pencil { bottom: 10px; left: 15%; width: 100px; transform: rotate(-25deg); }
        .dec-ruler { top: 100px; left: 20px; width: 120px; transform: rotate(20deg); }
        .dec-star1 { top: 15px; left: 35%; width: 30px; }
        .dec-star2 { top: 80px; right: 15%; width: 25px; }
        .dec-star3 { bottom: 10px; right: 40%; width: 35px; }


    </style>
</head>
