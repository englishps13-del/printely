<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timetables</title>
  <link rel="icon" type="image/x-icon" href="icon.webp">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet" />
  
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 16px;
      background: linear-gradient(to bottom right, #ede9fe, #d8b4fe);
      overflow-x: hidden;
      transition: background 0.5s ease;
    }
    body.dark { background: linear-gradient(to bottom right, #1e1b4b, #4c1d95); }

    /* NAVBAR STYLES (ADAPTED FROM INDEX.HTML) */
    nav {
      background: white;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      position: relative;
      z-index: 20;
      transition: background 0.3s ease;
    }
    body.dark nav { background: #1e1e2e; }

    nav .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
    }
    @media (min-width: 768px) {
      nav .container {
        padding: 1rem 2rem;
      }
    }
    
    #nav-links {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      flex-direction: column;
      align-items: center;
      gap: 0;
      list-style: none;
      margin: 0;
      padding: 1rem 0;
      border-radius: 0 0 12px 12px;
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
      transform: translateY(-10px);
      opacity: 0;
      pointer-events: none;
    }
    #nav-links.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    body.dark #nav-links {
      background: #1e1e2e;
    }
    #nav-links a {
      text-decoration: none;
      font-weight: 500;
      font-size: 1.1rem;
      color: #44475a;
      padding: 1rem 2rem;
      transition: color 0.3s ease;
      white-space: nowrap;
      cursor: pointer;
      display: block;
      width: 100%;
      text-align: center;
    }
    body.dark #nav-links a { color: #cdd6f4; }
    #nav-links a.active, #nav-links a:hover { color: #7c3aed; font-weight: 700; }

    @media (min-width: 768px) {
      #nav-links {
        position: static;
        flex-direction: row;
        background: transparent;
        box-shadow: none;
        gap: 3rem;
        padding: 0;
        transform: none;
        opacity: 1;
        pointer-events: auto;
      }
      #nav-links a {
        padding: 8px 0;
        width: auto;
      }
    }

    .underline {
      position: absolute;
      bottom: 0;
      height: 3px;
      background-color: #7c3aed;
      border-radius: 1px;
      transition: left 0.3s ease, width 0.3s ease;
      pointer-events: none;
      z-index: 5;
      left: 0;
      width: 0;
      display: none;
    }
    @media (min-width: 768px) {
      .underline {
        display: block;
      }
    }
    
    #menu-toggle {
      display: block;
      z-index: 30;
      border: none;
      background: transparent;
      cursor: pointer;
    }
    @media (min-width: 768px) {
      #menu-toggle { display: none; }
    }
    #menu-toggle .hamburger-line {
      width: 28px;
      height: 3px;
      background-color: #44475a;
      border-radius: 3px;
      display: block;
      margin: 5px 0;
      transition: all 0.3s ease-in-out;
    }
    body.dark #menu-toggle .hamburger-line { background-color: #cdd6f4; }

    #menu-toggle.active .hamburger-line:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    #menu-toggle.active .hamburger-line:nth-child(2) { opacity: 0; }
    #menu-toggle.active .hamburger-line:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    .shape {
      position: absolute;
      opacity: 0.15;
      z-index: 0;
      width: 2rem;
      height: 2rem;
      animation: float 10s ease-in-out infinite;
    }
    .shape.small { width: 1.25rem; height: 1.25rem; }
    .shape.rect-purple-300 { top: 20%; right: 3rem; fill: #c084fc; border-radius: 0.5rem; animation-delay: 2s; }
    .shape.circle-pink { top: 6rem; right: 2rem; fill: #f472b6; animation-duration: 12s; }
    .shape.rect-blue { bottom: 12%; left: 8%; fill: #60a5fa; border-radius: 0.25rem; animation-duration: 9s; animation-delay: 3s; }
    .shape.triangle-teal { top: 50%; left: 4%; fill: #2dd4bf; animation-duration: 11s; }
    .shape.diamond-yellow { top: 68%; right: 5rem; fill: #fde047; transform: rotate(45deg); animation-delay: 4s; }
    .shape.circle-gray { top: 80%; left: 20%; fill: #9ca3af; animation-duration: 13s; }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(10deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    
    .template-card {
      background-color: white;
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    body.dark .template-card {
      background-color: #1e1e2e;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .template-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(124, 58, 237, 0.4);
    }

    .zoom-container {
      overflow: hidden;
      border-radius: 1rem;
      cursor: pointer;
      position: relative;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      max-width: 100%; /* Ensure container does not exceed its parent */
    }
    .zoom-container img {
      border-radius: 1rem;
      display: block;
      width: 100%;
      height: auto; /* Fix for wide images */
      transition: filter 0.5s ease;
    }
    .zoom-container:hover img {
      filter: brightness(1.1);
    }

    .template-link {
      background-color: #7c3aed;
      padding: 0.5rem 1.75rem;
      border-radius: 9999px;
      color: white;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 3px 8px rgba(124, 58, 237, 0.5);
      user-select: none;
      display: inline-block;
    }
    .template-link:hover {
      background-color: #5b21b6;
      box-shadow: 0 5px 15px rgba(91, 33, 182, 0.7);
    }

    .template-link-alt {
      background-color: #7c3aed;
      padding: 0.5rem 1.75rem;
      border-radius: 9999px;
      color: white;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 3px 8px rgba(124, 58, 237, 0.5);
      user-select: none;
      white-space: nowrap;
    }
    .template-link-alt:hover {
      background-color: #5b21b6;
      box-shadow: 0 5px 15px rgba(91, 33, 182, 0.7);
    }
    
    .theme-switcher { display: inline-block; position: relative; user-select: none; }
    .switch {
      display: flex; align-items: center;
      width: 90px; height: 42px;
      background: linear-gradient(to right, #d8b4fe, #a78bfa);
      border-radius: 42px;
      cursor: pointer; position: relative;
    }
    .icon { width: 30px; height: 30px; pointer-events: none; user-select: none; }
    .sun { margin-left: 10px; }
    .moon { margin-left: auto; margin-right: 10px; }
    .slider {
      position: absolute; width: 38px; height: 38px;
      background: white; border-radius: 50%;
      top: 2px; left: 3px;
      transition: left 0.3s ease;
      box-shadow: 0 0 6px rgba(0,0,0,0.2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .slider img { width: 24px; height: 24px; }
    #dm-toggle { position: absolute; opacity: 0; width: 0; height: 0; }
    #dm-toggle:checked + .switch .slider { left: 49px; }
  </style>
</head>

<body class="min-h-screen">
  
  <nav class="sticky top-4 max-w-5xl mx-auto z-50">
    <div class="container">
       <button id="menu-toggle" class="md:hidden order-last" aria-label="Open Menu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      
      <ul id="nav-links" class="hidden md:flex">
        <li><a href="index.html">Main page</a></li>
        <li><a href="section2.html" class="active">Timetables</a></li>
        <li><a href="section3.html">Sign up</a></li>
        <li><a href="section4.html">Soon</a></li>
      </ul>
      
      <div class="theme-switcher">
        <input type="checkbox" id="dm-toggle" aria-label="Toggle Dark Mode" />
        <label for="dm-toggle" class="switch">
          <img src="https://cdn-icons-png.flaticon.com/512/3258/3258157.png" alt="Light Mode Icon" class="icon sun" />
          <img src="https://cdn-icons-png.flaticon.com/512/4445/4445942.png" alt="Dark Mode Icon" class="icon moon" />
          <div class="slider">
            <img src="https://cdn-icons-png.flaticon.com/512/3258/3258157.png" alt="Current Theme Icon" id="slider-icon" />
          </div>
        </label>
      </div>
      <div class="underline"></div>
    </div>
  </nav>

  <div class="text-center py-8 px-4 md:py-12 md:px-6 relative z-10">
    <h1 class="text-4xl font-extrabold text-purple-800 dark:text-purple-200 mb-4"> Explore Stunning Timetables for FREE</h1>
    <p class="text-lg text-gray-800 dark:text-gray-300">Choose a Timetable to get started with your lesson plan.</p>
  </div>
  
  <div class="grid gap-6 md:gap-10 grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 justify-items-center mt-8 px-4 md:px-12">
    <div class="template-card">
      <a href="1.html" class="zoom-container">
        <img src="timetable1.png" alt="Timetable template 1" />
      </a>
      <a href="1.html" class="template-link-alt">Go to table 1</a>
    </div>
    <div class="template-card">
      <a href="2.html" class="zoom-container">
        <img src="timetable2.png" alt="Timetable template 2" />
      </a>
      <a href="2.html" class="template-link-alt">Go to table 2</a>
    </div>
    <div class="template-card">
      <a href="3.html" class="zoom-container">
        <img src="timetable3.png" alt="Timetable template 3" />
      </a>
      <a href="3.html" class="template-link-alt">Go to table 3</a>
    </div>
    <div class="template-card">
      <a href="4.html" class="zoom-container">
        <img src="timetable4.png" alt="Timetable template 4" />
      </a>
      <a href="4.html" class="template-link-alt">Go to table 4</a>
    </div>
    <div class="template-card">
      <a href="5.html" class="zoom-container">
        <img src="timetable5.png" alt="Timetable template 5" />
      </a>
      <a href="5.html" class="template-link-alt">Go to table 5</a>
    </div>
    <div class="template-card">
      <a href="6.html" class="zoom-container">
        <img src="timetable6.png" alt="Timetable template 6" />
      </a>
      <a href="6.html" class="template-link-alt">Go to table 6</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const menuContainer = document.querySelector('nav .container');
      const underline = document.querySelector('.underline');
      const allLinks = document.querySelectorAll('#nav-links a');
      const toggleCheckbox = document.getElementById('dm-toggle');
      const body = document.body;
      const sliderIcon = document.getElementById('slider-icon');
      const lightIcon = "https://cdn-icons-png.flaticon.com/512/3258/3258157.png";
      const darkIcon = "https://cdn-icons-png.flaticon.com/512/4445/4445942.png";

      const menuToggle = document.getElementById('menu-toggle');
      const navLinks = document.getElementById('nav-links');

      menuToggle.addEventListener('click', () => {
        menuToggle.classList.toggle('active');
        navLinks.classList.toggle('hidden');
        navLinks.classList.toggle('active');
      });

      function moveUnderline(element) {
        if (!element || window.innerWidth < 768) return;
        const rect = element.getBoundingClientRect();
        const parentRect = menuContainer.getBoundingClientRect();
        const left = rect.left - parentRect.left + menuContainer.scrollLeft;
        const width = rect.width;
        underline.style.width = width + 'px';
        underline.style.left = left + 'px';
      }
      
      function updateSliderIcon() {
        if (body.classList.contains('dark')) {
          sliderIcon.src = darkIcon;
        } else {
          sliderIcon.src = lightIcon;
        }
      }

      function setDarkMode(enabled) {
        if (enabled) {
          body.classList.add('dark');
          toggleCheckbox.checked = true;
          localStorage.setItem('theme', 'dark');
        } else {
          body.classList.remove('dark');
          toggleCheckbox.checked = false;
          localStorage.setItem('theme', 'light');
        }
        updateSliderIcon();
      }
      
      const storedTheme = localStorage.getItem('theme');
      if (storedTheme === 'dark') {
        setDarkMode(true);
      } else {
        setDarkMode(false);
      }

      setTimeout(() => {
          const activeLink = document.querySelector('a.active') || allLinks[0];
          moveUnderline(activeLink);
      }, 50);

      allLinks.forEach(link => {
        link.addEventListener('mouseenter', () => moveUnderline(link));
        link.addEventListener('click', () => {
          allLinks.forEach(l => l.classList.remove('active'));
          link.classList.add('active');
          
          if (window.innerWidth < 768) {
            menuToggle.classList.remove('active');
            navLinks.classList.add('hidden');
            navLinks.classList.remove('active');
          }
        });
      });
      
      menuContainer.addEventListener('mouseleave', () => {
          const activeLink = document.querySelector('a.active') || allLinks[0];
          moveUnderline(activeLink);
      });

      window.addEventListener('resize', () => {
        const activeLink = document.querySelector('a.active') || allLinks[0];
        moveUnderline(activeLink);
        if (window.innerWidth >= 768) {
          menuToggle.classList.remove('active');
          navLinks.classList.remove('active');
          navLinks.classList.add('hidden');
        }
      });

      toggleCheckbox.addEventListener('change', () => {
        setDarkMode(toggleCheckbox.checked);
      });
    });
  </script>

</body>
</html>
