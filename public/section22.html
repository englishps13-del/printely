  <style>
    :root {
      --brand-color: #7c3aed;
      --background-light: #f3e8ff;
      --background-dark: #1e1b4b;
    }
  
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--background-light);
      transition: background-color 0.5s ease, color 0.5s ease;
      color: #1e1e2e;
      overflow-x: hidden;
      padding-bottom: 80px; 
    }
  
    body.dark {
      background-color: var(--background-dark);
      color: #e0e7ff;
    }
    
    /* BOTTOM NAVIGATION */
    .mobile-bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
      z-index: 1000; display: flex; justify-content: space-around; align-items: center;
    }
    body.dark .mobile-bottom-nav {
      background: rgba(30, 27, 75, 0.7);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .mobile-nav-link {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex-grow: 1; color: #4a5568; transition: color 0.3s ease, transform 0.2s ease;
    }
    .mobile-nav-link .nav-icon { width: 24px; height: 24px; margin-bottom: 2px; }
    .mobile-nav-link .nav-text { font-size: 0.7rem; font-weight: 500; }
    .mobile-nav-link.active { color: var(--brand-color); transform: translateY(-3px); }
    body.dark .mobile-nav-link { color: #a0aec0; }
    body.dark .mobile-nav-link.active { color: #c4b5fd; }

    /* THEME TOGGLE */
    .theme-switcher { position: relative; }
    .switch { display: flex; align-items: center; width: 50px; height: 28px; background: #a78bfa; border-radius: 28px; cursor: pointer; position: relative; }
    body.dark .switch { background: #4c1d95; }
    .slider { position: absolute; width: 22px; height: 22px; background: white; border-radius: 50%; top: 3px; left: 4px; transition: transform 0.3s ease-in-out; }
    #dm-toggle { opacity: 0; width: 0; height: 0; }
    #dm-toggle:checked + .switch .slider { transform: translateX(21px); }
    .slider-icon { width: 14px; height: 14px; transition: opacity 0.3s ease, transform 0.3s ease; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); opacity: 0; }
    #dm-toggle:not(:checked) + .switch .sun-icon { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    #dm-toggle:checked + .switch .moon-icon { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    
    /* Card and Link Effects */
    .zoom-container {
      overflow: hidden;
      border-radius: 1rem;
      cursor: pointer;
      position: relative;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }
    body.dark .zoom-container {
        background: rgba(45, 34, 101, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .zoom-container:hover {
      box-shadow: 0 10px 25px rgba(131, 71, 255, 0.3);
      transform: translateY(-4px);
    }
    .zoom-container img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5; /* Made images less tall */
      object-fit: cover;
      object-position: top; /* Show the top of the image */
    }
    .link-container {
      padding: 0.75rem;
      text-align: center;
    }
    .template-link {
      background-color: var(--brand-color);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      text-decoration: none;
      transition: background-color 0.3s ease;
      display: inline-block;
    }
    .template-link:hover {
      background-color: #5b21b6;
    }
  </style>
</head>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const toggleCheckbox = document.getElementById('dm-toggle');
      const body = document.body;
      const storedTheme = localStorage.getItem('theme');
      if (storedTheme === 'dark') {
        body.classList.add('dark');
        toggleCheckbox.checked = true;
      }
      toggleCheckbox.addEventListener('change', () => {
        if (toggleCheckbox.checked) {
          body.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          body.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      });
    });
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCVtWA2FqatlTRR1gSzCTNUSFYUAbAwLW0",
      authDomain: "printelydz.firebaseapp.com",
      projectId: "printelydz",
      storageBucket: "printelydz.appspot.com",
      messagingSenderId: "49201277305",
      appId: "1:49201277305:web:df932043e4d6d986cae7a8",
      measurementId: "G-R4VJL5SR88"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const userInfoContainer = document.getElementById('user-info-container');
    const accountMobileLink = document.getElementById('account-nav-link-mobile');
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userInfoContainer.innerHTML = `<button id="logout-btn" title="Sign Out" class="px-3 py-1.5 bg-red-500 text-white rounded-lg hover:bg-red-600 text-sm font-semibold">Sign Out</button>`;
        document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));
        if(accountMobileLink) accountMobileLink.href = 'dashboard2.html';
      } else {
        userInfoContainer.innerHTML = `<a href="login2.html" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm font-semibold shadow-md">Login</a>`;
        if(accountMobileLink) accountMobileLink.href = 'login2.html';
      }
    });
  </script>
