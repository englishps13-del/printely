<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Themed Class Timetable</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #ffffff; /* Changed to white background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            width: 100%;
        }
        
        .page-container {
            width: 1123px; /* A4 landscape size in pixels at 96dpi */
            height: 794px; /* A4 landscape size in pixels at 96dpi */
            position: relative;
            background: linear-gradient(135deg, #f0e6f2 0%, #e6a8e8 100%);     
            border-radius: 0px;
            overflow: hidden;
        }
        
        .container {
            width: 85%; /* Wider timetable */
            max-width: 800px; /* Increased max-width */
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        
        /* Space background elements */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .star {
            position: absolute;
            background-color: #FFD700; /* Golden stars */
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        
        /* SVG elements positioned outside the table area */
        .svg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Allows clicking through to table */
        }
        
        .planet {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #a065ec, #6a1b9a);
            top: 5%;
            right: 5%;
            box-shadow: 0 0 30px rgba(160, 101, 236, 0.7);
        }
        
        .planet::before {
            content: '';
            position: absolute;
            width: 240px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            top: 70px;
            left: -30px;
            transform: rotate(-20deg);
        }
        
        .rocket {
            position: absolute;
            bottom: 5%;
            left: 5%;
            font-size: 60px;
            color: #ff9e80;
            transform: rotate(-30deg);
        }
        
        .astronaut {
            position: absolute;
            bottom: 5%;
            right: 25%;
            font-size: 55px;
            color: #e0f7fa;
        }
        
        .satellite {
            position: absolute;
            top: 5%;
            left: 5%;
            font-size: 50px;
            color: #b3e5fc;
            transform: rotate(15deg);
        }
        
        .meteor {
            position: absolute;
            top: 15%;
            right: 15%;
            width: 120px;
            height: 4px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 100%);
            transform: rotate(-45deg);
        }
        
        .meteor::before {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: #fff;
            right: 0;
            top: -5.5px;
        }
        
        /* New SVG elements */
        .moon {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f5f5f5, #d1d1d1);
            top: 10%;
            left: 15%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }
        
        .moon::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(200, 200, 200, 0.3);
            top: 20px;
            left: 30px;
        }
        
        .moon::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(200, 200, 200, 0.3);
            top: 60px;
            left: 60px;
        }
        
        .spaceship {
            position: absolute;
            top: 25%;
            left: 20%;
            font-size: 45px;
            color: #b39ddb;
            transform: rotate(15deg);
        }
        
        .comet {
            position: absolute;
            top: 10%;
            right: 35%;
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,215,0,0.8) 100%);
            transform: rotate(30deg);
        }
        
        .comet::before {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #FFD700;
            right: 0;
            top: -4.5px;
        }
        
        .galaxy {
            position: absolute;
            bottom: 10%;
            right: 10%;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(138,43,226,0.3) 0%, rgba(138,43,226,0) 70%);
            transform: rotate(45deg);
        }
        
        .ufo {
            position: absolute;
            top: 40%;
            right: 10%;
            font-size: 40px;
            color: #81d4fa;
        }
        
        .title {
            text-align: center;
            color: #fff;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }
        
        .timetable {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .timetable th, .timetable td {
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            text-align: center;
            color: #fff;
        }
        
        .timetable th {
            background-color: rgba(106, 27, 154, 0.7);
            font-weight: 600;
            font-size: 16px;
        }
        
        .timetable td {
            background-color: rgba(255, 255, 255, 0.8);
            color: #333;
            font-size: 14px;
            height: 40px;
        }
        
        .timetable tr:hover td {
            background-color: rgba(255, 255, 255, 0.9);
        }
        
        .time-col {
            background-color: rgba(106, 27, 154, 0.5) !important;
            font-weight: 500;
            color: #fff !important;
        }
        
        .day-col {
            background-color: rgba(106, 27, 154, 0.5) !important;
            font-weight: 500;
            color: #fff !important;
        }
        
        /* Make cells editable */
        .editable {
            cursor: text;
            transition: background-color 0.3s;
        }
        
        .editable:focus {
            outline: 2px solid #FFD700;
            background-color: rgba(255, 255, 255, 0.95);
        }
        
        @media (max-width: 1200px) {
            .page-container {
                width: 100%;
                height: auto;
                min-height: 794px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                width: 85%;
                padding: 15px;
            }
            
            .title {
                font-size: 28px;
            }
            
            .timetable th, .timetable td {
                padding: 8px;
                font-size: 12px;
            }
            
            .planet, .rocket, .astronaut, .satellite, .moon, .spaceship, .comet, .galaxy, .ufo {
                display: none; /* Hide elements on small screens */
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Space Background Elements -->
        <div class="stars">
            <!-- Stars will be generated by JavaScript -->
        </div>
        
        <!-- SVG Container - positioned outside the table area -->
        <div class="svg-container">
            <div class="planet"></div>
            <div class="rocket"><i class="fas fa-rocket"></i></div>
            <div class="astronaut"><i class="fas fa-user-astronaut"></i></div>
            <div class="satellite"><i class="fas fa-satellite"></i></div>
            <div class="meteor"></div>
            
            <!-- New SVG elements -->
            <div class="moon"></div>
            <div class="spaceship"><i class="fas fa-space-shuttle"></i></div>
            <div class="comet"></div>
            <div class="galaxy"></div>
            <div class="ufo"><i class="fas fa-ufo"></i></div>
        </div>
        
        <div class="container">
            <h1 class="title">Class Timetable</h1>
            
            <table class="timetable">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="time-col">08:00</td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                    </tr>
                    <tr>
                        <td class="time-col">09:00</td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                    </tr>
                    <tr>
                        <td class="time-col">10:00</td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                    </tr>
                    <tr>
                        <td class="time-col">11:00</td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                    </tr>
                    <tr>
                        <td class="time-col">12:00</td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                    </tr>
                    <tr>
                        <td class="time-col">13:00</td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                    </tr>
                    <tr>
                        <td class="time-col">14:00</td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                    </tr>
                    <tr>
                        <td class="time-col">15:00</td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                    </tr>
                    <tr>
                        <td class="time-col">16:00</td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                        <td class="editable" contenteditable="true"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Generate random stars
        document.addEventListener('DOMContentLoaded', function() {
            const starsContainer = document.querySelector('.stars');
            const numberOfStars = 1200; /* More stars for larger background */
            
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Random position
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                
                // Random size
                const size = Math.random() * 3;
                
                // Set styles
                star.style.left = `${left}%`;
                star.style.top = `${top}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // Random animation delay
                star.style.animationDelay = `${Math.random() * 3}s`;
                
                starsContainer.appendChild(star);
            }
            
            // Add event listeners for editable cells
            const editableCells = document.querySelectorAll('.editable');
            editableCells.forEach(cell => {
                cell.addEventListener('focus', function() {
                    this.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
                });
                
                cell.addEventListener('blur', function() {
                    this.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
                });
            });
        });
    </script>
</body>
</html>
