<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Schedule</title>
    <style>
        body {
            background-color: #f4e4d1;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23f4e4d1"/><path d="M0 0 L50 50 L100 0 Z" fill="%23d9b99b" opacity="0.5"/><path d="M0 100 L50 50 L100 100 Z" fill="%23d9b99b" opacity="0.5"/></svg>');
            background-size: 150px 150px;
            padding: 20px;
        }
        .container {
            position: relative;
            max-width: 900px;
            background-color: #fff;
            border: 5px solid #d9b99b;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 15px;
            background-color: #f4e4d1;
            font-size: 24px;
            color: #8b4513;
        }
        .header h1 {
            margin: 0;
            font-size: 2.2em;
        }
        .header h2 {
            margin: 0;
            font-size: 1.4em;
        }
        .schedule {
            display: grid;
            grid-template-columns: minmax(max-content, 1fr) repeat(5, 2fr);
            /* Removed the gap property to make borders uniform */
            background-color: #d9b99b;
            padding: 5px;
        }
        .schedule div {
            background-color: #fff;
            padding: 15px 10px;
            text-align: center;
            border: 1px solid #d9b99b;
        }
        .schedule .time {
            background-color: #d9b99b;
            color: #fff;
            font-weight: bold;
        }
        .schedule .day {
            background-color: #d9b99b;
            color: #fff;
            font-weight: bold;
        }
        .editable {
            border: none;
            background: transparent;
            text-align: center;
            width: 100%;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 16px;
        }
        .editable:focus {
            outline: none;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 contenteditable="true">Class Schedule</h1>
            <h2 contenteditable="true">Borcelle High School</h2>
        </div>
        <div class="schedule">
            <div class="time" contenteditable="true">Time</div>
            <div class="day" contenteditable="true">Mon</div>
            <div class="day" contenteditable="true">Tue</div>
            <div class="day" contenteditable="true">Wed</div>
            <div class="day" contenteditable="true">Thu</div>
            <div class="day" contenteditable="true">Fri</div>
            <div class="time" contenteditable="true">8:00 9:00</div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div>
            <div class="time" contenteditable="true">9:00 10:00</div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div>
            <div class="time" contenteditable="true">10:00 11:00</div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div>
            <div class="time" contenteditable="true">11:00 12:00</div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div>
            <div class="time" contenteditable="true">12:00 13:00</div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div>
            <div class="time" contenteditable="true">13:00 14:00</div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div>
            <div class="time" contenteditable="true">14:00 15:00</div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div>
            <div class="time" contenteditable="true">15:00 16:00</div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div><div contenteditable="true"></div>
        </div>
    </div>
</body>
</html>
